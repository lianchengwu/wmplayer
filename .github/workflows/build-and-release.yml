name: Build & Release wmPlayer

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. Linux Build (Ubuntu)
  # ==========================================
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev

      - name: Install Wails v3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Download KuGouMusicApi Binary (Linux)
        run: |
          mkdir -p bin
          echo "⬇️ 正在直接下载 MakcRe/KuGouMusicApi 二进制包 (app_linux)..."
          curl -f -L https://github.com/MakcRe/KuGouMusicApi/releases/latest/download/app_linux -o bin/KuGouMusicApi
          chmod +x bin/KuGouMusicApi

      - name: Build Frontend & Generate Bindings
        run: |
          wails3 generate bindings .
          cd frontend
          npm install
          npm run build
          cd ..

      - name: Compile wmPlayer (Linux)
        run: |
          mkdir -p bin
          go build -tags production -trimpath -buildvcs=false -ldflags="-w -s" -o bin/wmplayer .
          chmod +x bin/wmplayer

      - name: Build / Fetch OSD Lyrics (Linux)
        run: |
          mkdir -p bin
          if [ -d "lyric/osdlyric" ]; then
            echo "🔨 编译本地 OSD 歌词..."
            cd lyric/osdlyric && make && cp osd_lyrics ../../bin/ && cd ../..
          elif git clone --depth 1 https://github.com/lianchengwu/wmplayer-lyric.git tmp-lyric 2>/dev/null; then
            echo "🔨 编译拉取的 wmplayer-lyric..."
            if [ -d "tmp-lyric/osdlyric" ]; then
              cd tmp-lyric/osdlyric && make && cp osd_lyrics ../../bin/ && cd ../..
            fi
            if [ -d "tmp-lyric/plasma-lyrics" ]; then
              mkdir -p bin/lyrics
              cp -r tmp-lyric/plasma-lyrics bin/lyrics/
            fi
            rm -rf tmp-lyric
          fi || echo "⚠️ 歌词扩展编译已跳过"

      - name: Package Linux Archive
        run: |
          cd bin
          FILES_TO_PACK="wmplayer KuGouMusicApi"
          [ -f osd_lyrics ] && FILES_TO_PACK="$FILES_TO_PACK osd_lyrics"
          [ -d lyrics ] && FILES_TO_PACK="$FILES_TO_PACK lyrics"
          tar -czvf wmplayer-linux-amd64.tar.gz $FILES_TO_PACK
          cd ..
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wmplayer-linux-amd64
          path: bin/wmplayer-linux-amd64.tar.gz

  # ==========================================
  # 2. Windows Build
  # ==========================================
  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Wails v3 CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Download KuGouMusicApi Binary (Windows)
        shell: bash
        run: |
          mkdir -p bin
          echo "⬇️ 正在直接下载 MakcRe/KuGouMusicApi 二进制包 (app_win.exe)..."
          curl -f -L https://github.com/MakcRe/KuGouMusicApi/releases/latest/download/app_win.exe -o bin/KuGouMusicApi.exe

      - name: Build Frontend & Generate Bindings
        shell: bash
        run: |
          wails3 generate bindings .
          cd frontend
          npm install
          npm run build
          cd ..

      - name: Compile wmPlayer (Windows)
        shell: bash
        run: |
          mkdir -p bin
          wails3 generate syso -arch amd64 -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info build/windows/info.json -out wails_windows_amd64.syso || true
          go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui" -o bin/wmplayer.exe .
          rm -f *.syso

      - name: Package Windows Zip
        shell: bash
        run: |
          cd bin
          FILES_TO_PACK="wmplayer.exe KuGouMusicApi.exe"
          [ -f osd_lyrics.exe ] && FILES_TO_PACK="$FILES_TO_PACK osd_lyrics.exe"
          [ -d lyrics ] && FILES_TO_PACK="$FILES_TO_PACK lyrics"
          7z a -tzip wmplayer-windows-amd64.zip $FILES_TO_PACK
          cd ..

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wmplayer-windows-amd64
          path: bin/wmplayer-windows-amd64.zip
  # ==========================================
  # 3. macOS Build
  # ==========================================
  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Wails v3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Download KuGouMusicApi Binary (macOS)
        run: |
          mkdir -p bin
          echo "⬇️ 正在直接下载 MakcRe/KuGouMusicApi 二进制包 (app_macos)..."
          curl -f -L https://github.com/MakcRe/KuGouMusicApi/releases/latest/download/app_macos -o bin/KuGouMusicApi
          chmod +x bin/KuGouMusicApi

      - name: Build Frontend & Generate Bindings
        run: |
          wails3 generate bindings .
          cd frontend
          npm install
          npm run build
          cd ..

      - name: Compile wmPlayer .app Bundle (macOS)
        run: |
          mkdir -p bin/wmplayer.app/Contents/{MacOS,Resources}
          go build -tags production -trimpath -buildvcs=false -ldflags="-w -s" -o bin/wmplayer.app/Contents/MacOS/wmplayer .
          cp build/darwin/icons.icns bin/wmplayer.app/Contents/Resources/ || true
          cp build/darwin/Info.plist bin/wmplayer.app/Contents/ || true
          cp bin/KuGouMusicApi bin/wmplayer.app/Contents/Resources/ || true
          cp bin/KuGouMusicApi bin/wmplayer.app/Contents/MacOS/ || true
          [ -f bin/osd_lyrics ] && cp bin/osd_lyrics bin/wmplayer.app/Contents/MacOS/ || true
          [ -f bin/osd_lyrics ] && cp bin/osd_lyrics bin/wmplayer.app/Contents/Resources/ || true
      - name: Package macOS Zip
        run: |
          cd bin
          zip -r wmplayer-darwin-universal.zip wmplayer.app
          cd ..
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wmplayer-darwin-universal
          path: bin/wmplayer-darwin-universal.zip

  # ==========================================
  # 4. GitHub Release (On Tags)
  # ==========================================
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Verify release files
        run: |
          ls -lh release_assets/
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
